services:
  db:
    image: postgres:15-alpine
    container_name: contenedor_postgres
    restart: always
    environment:
      POSTGRES_DB: catalogo_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - red_app

  web:
    build: ./app
    container_name: contenedor_flask
    restart: always
    environment:
      DB_HOST: db
      DB_NAME: catalogo_db
      DB_USER: admin
      DB_PASS: admin123
    depends_on:
      - db
    networks:
      - red_app

  nginx:
    image: nginx:alpine
    container_name: contenedor_nginx
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
    networks:
      - red_app

volumes:
  postgres_data:

networks:
  red_app:
    driver: bridge
